[package]
name = "amr_project"
version = "0.1.0"
edition = "2021"

# Explicitly define the binary target
[[bin]]
name = "executable_amr" # You can choose a name for your executable
path = "src/main.rs"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.7"
lazy_static = "1.4"
plotters = "0.3"
chrono = "0.4" 

