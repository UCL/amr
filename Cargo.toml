[package]
name = "amr_project"
version = "0.1.0"
edition = "2021"

# Explicitly define the binary target
[[bin]]
name = "executable_amr" # You can choose a name for your executable
path = "src/main.rs"

[[bin]]
name = "dump_parameter_appendix"
path = "src/bin/dump_parameter_appendix.rs"

[features]
default = []
# Enable "plots" when the plotting helpers are needed; it keeps heavy GUI deps out of
# the normal build so rebuilds stay fast.
plots = ["dep:plotters"]

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.7"
lazy_static = "1.4"
chrono = "0.4" 
plotters = { version = "0.3", optional = true, default-features = false }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
log = "0.4"
env_logger = "0.11"
fast-math = "0.1.1"

